# Configuración del análisis de SonarQube (etapa 5 del pipeline, job sonarqube).
#
# La lee sonar-scanner-cli desde la raíz del repo. El job no la usa directo: corre
# tools/sonarqube/run.mjs, que levanta un SonarQube temporal, lanza el scanner con este
# archivo y borra el contenedor al final. Detalle en docs/pipeline.md.

sonar.projectKey=biblioteca-uc
sonar.projectName=Biblioteca UC
sonar.sourceEncoding=UTF-8

# Código que se publica. Cada carpeta tiene su tsconfig: así SonarQube entiende los tipos
# de TypeScript igual que el compilador de cada app.
sonar.sources=backend/src,frontend/src
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# Tests: SonarQube los analiza aparte. No cuentan para la cobertura ni para la duplicación
# del código que se publica. Los tests unitarios viven junto al código en src, por eso cada
# patrón aparece en sonar.test.inclusions y también en sonar.exclusions (un archivo no puede
# ser código y test al mismo tiempo).
sonar.tests=backend/src,backend/test,frontend/src,frontend/tests
sonar.test.inclusions=**/*.spec.ts,**/*.int-spec.ts,**/*.test.ts,**/*.test.tsx,backend/test/**,frontend/tests/**

# Fuera del análisis: los tests (ya están arriba) y el código generado.
# schema.d.ts lo genera openapi-typescript desde specs/api/openapi.yaml (npm run api:generate)
# y frontend/public/mockServiceWorker.js lo genera MSW (está fuera de sonar.sources).
sonar.exclusions=**/*.spec.ts,**/*.int-spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/shared/api/schema.d.ts

# Las migraciones se escriben una vez y se parecen entre sí a propósito (crear tabla, crear
# índice). Se analizan en busca de bugs, pero no cuentan para la duplicación.
sonar.cpd.exclusions=backend/src/database/migrations/**

# Cobertura: los lcov de los tests unitarios (etapa 5). tools/sonarqube/run.mjs los copia aquí
# desde backend/reports/coverage y frontend/reports/coverage y corrige las rutas para que
# partan desde la raíz del repo (backend/src/... en vez de src/...).
sonar.javascript.lcov.reportPaths=reports/sonarqube/lcov/backend.info,reports/sonarqube/lcov/frontend.info

# Se mide la cobertura de las mismas carpetas que miden los tests unitarios
# (backend/jest.unit.config.js y frontend/vitest.config.mts). Infraestructura, presentación,
# rutas de Next y mocks se prueban con integración, contrato y E2E (etapas 6, 7 y 9), que no
# generan lcov. Si cambias esas configuraciones, cambia también esta lista.
sonar.coverage.exclusions=backend/src/*.ts,backend/src/*/*.ts,backend/src/**/infrastructure/**,backend/src/**/presentation/**,backend/src/database/**,frontend/src/app/**,frontend/src/providers/**,frontend/src/mocks/**

# Cada corrida crea un proyecto nuevo, así que no hay "código nuevo" que comparar con la
# historia de git. Sin git el análisis es más rápido y no depende de cuántos commits trae el
# checkout del job.
sonar.scm.disabled=true

# El scanner espera a que SonarQube procese el análisis y termina con error si la quality
# gate falla.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
