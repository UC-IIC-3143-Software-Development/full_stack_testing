name: tests

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el workflow solo lee el código
permissions:
  contents: read

jobs:
  # Loop rápido (micro): debe tardar "lo que dura preparar un té" (libro, p. 127).
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Presupuesto de tests (pirámide, duplicados, aserciones débiles, flaky)
        run: npm run budget

  # Mutation testing solo sobre los archivos de src que cambió el PR:
  # es caro, así que se usa con criterio (libro, p. 116).
  mutation:
    if: github.event_name == 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Los valores del PR (rama base y nombres de archivo) llegan por env y no se
      # interpolan en el script: un archivo llamado src/a$(curl ...).js no se ejecuta
      - name: Archivos de src modificados
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'src/*.js' | grep -v server.js | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Mutation testing de los archivos modificados
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npx stryker run --mutate "$FILES" --thresholds.break 80
