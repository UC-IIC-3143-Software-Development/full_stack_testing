# Reglas de estilo del contrato (specs/api/openapi.yaml).
# Se ejecuta con `npm run lint:openapi` y en la etapa 2 del pipeline.
#
# Spectral es un linter de contratos: no prueba la API, revisa que el contrato
# esté completo y sea consistente ANTES de escribir código (spec first).
# Parte del ruleset oficial `spectral:oas` y agrega reglas propias del curso,
# cada una explicada con el defecto que evita.
#
# El build falla solo con errores (--fail-severity error). Las advertencias se ven en
# el log: hoy spectral:oas avisa que createBook, getBook, createLoan y returnLoan no
# tienen description. Es una mejora pendiente del contrato, no un error.
extends:
  - spectral:oas

rules:
  # Los operationId se convierten en nombres de funciones del cliente generado
  # (openapi-typescript) y aparecen en la evidencia del PR. camelCase evita
  # nombres como `get_books` o `GetBooks` mezclados en el mismo proyecto.
  biblioteca-operation-id-camel-case:
    description: El operationId debe estar en camelCase (por ejemplo createLoan).
    message: '{{value}} no está en camelCase.'
    severity: error
    given: $.paths[*][get,put,post,delete,patch,options,head,trace].operationId
    then:
      function: casing
      functionOptions:
        type: camel

  # Sin tags la documentación queda desordenada y sin summary la tabla de
  # endpoints de la evidencia del PR queda vacía.
  biblioteca-operation-tags:
    description: Toda operación declara al menos un tag.
    message: La operación no tiene tags.
    severity: error
    given: $.paths[*][get,put,post,delete,patch,options,head,trace]
    then:
      - field: tags
        function: truthy
      - field: tags
        function: length
        functionOptions:
          min: 1

  biblioteca-operation-summary:
    description: Toda operación tiene un summary corto.
    message: La operación no tiene summary.
    severity: error
    given: $.paths[*][get,put,post,delete,patch,options,head,trace]
    then:
      field: summary
      function: truthy

  # Todos los errores 4xx usan Problem Details (RFC 9457). El frontend muestra
  # mensajes según el campo `code`, así que un 4xx sin ese formato rompe la UI.
  biblioteca-4xx-problem-json:
    description: Las respuestas 4xx usan el media type application/problem+json.
    message: La respuesta 4xx no declara application/problem+json.
    severity: error
    given: $.paths[*][get,put,post,delete,patch].responses[?(@property.match(/^4/))].content
    then:
      field: application/problem+json
      function: truthy

  # Se revisa sin resolver referencias para comprobar que el schema es un componente
  # Problem (o una variante con el mismo formato, como RenewalProblem) y no una copia
  # en línea que se desactualiza.
  biblioteca-problem-schema-ref:
    description: El schema de application/problem+json referencia a un componente *Problem.
    message: El error no referencia el schema Problem.
    severity: error
    resolved: false
    given: $..content['application/problem+json'].schema
    then:
      - field: $ref
        function: truthy
      - field: $ref
        function: pattern
        functionOptions:
          match: '#/components/schemas/[A-Za-z]*Problem$'

  # Si una operación recibe datos (parámetros o body), puede recibir datos
  # inválidos. El contrato tiene que decir qué pasa en ese caso.
  biblioteca-input-documents-400:
    description: Toda operación con parámetros o body documenta la respuesta 400.
    message: La operación recibe datos pero no documenta la respuesta 400.
    severity: error
    given: $.paths[*][?(@ && (@.parameters || @.requestBody))].responses
    then:
      field: '400'
      function: truthy

  # El backend expone todo bajo /api y el frontend reenvía /api/* al backend
  # (rewrite de Next). Un path fuera de /api no llegaría nunca al backend.
  biblioteca-paths-under-api:
    description: Todos los paths empiezan con /api.
    message: '{{property}} no empieza con /api.'
    severity: error
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: '^/api(/|$)'

  # Los ejemplos documentan y además alimentan a Schemathesis y a los agentes
  # de IA que proponen tests desde el contrato.
  biblioteca-request-body-example:
    description: Todo request body tiene example o examples.
    message: El request body no tiene ejemplo.
    severity: error
    given: $.paths[*][*].requestBody.content[*]
    then:
      function: or
      functionOptions:
        properties:
          - example
          - examples

  biblioteca-parameter-description:
    description: Todo parámetro tiene descripción.
    message: Falta la descripción del parámetro.
    severity: error
    given:
      - $.paths[*][*].parameters[*]
      - $.components.parameters[*]
    then:
      field: description
      function: truthy
