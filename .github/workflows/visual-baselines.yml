# Capturas de referencia para los tests visuales (toHaveScreenshot).
#
# Las capturas dependen del sistema operativo, las fuentes y el navegador. Por eso se
# generan en la MISMA imagen Docker de Playwright que usa la etapa 7 del CI y nunca en
# el computador de cada persona. Este workflow las regenera y las commitea en la rama:
#   - automáticamente en main si todavía no existen
#   - a mano (workflow_dispatch) cuando un cambio de UI es intencional
# Un commit hecho con GITHUB_TOKEN no dispara otros workflows, así que no hay bucles.
name: Capturas de referencia visuales

on:
  push:
    branches: [main]
    paths:
      - 'frontend/tests/visual/**'
      - '.github/workflows/visual-baselines.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    name: Generar y commitear capturas de referencia
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ¿Hace falta generar?
        id: decidir
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ ! -d tests/visual/__screenshots__ ]; then
            echo "generar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Las capturas ya existen. Para regenerarlas usa workflow_dispatch."
            echo "generar=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.decidir.outputs.generar == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.decidir.outputs.generar == 'true'
        run: npm ci
      - name: Generar capturas en la imagen de CI
        if: steps.decidir.outputs.generar == 'true'
        run: npm run test:e2e -- --project=visual --update-snapshots
        env:
          CI: 'true'
          HOME: /root
      - name: Commitear capturas
        if: steps.decidir.outputs.generar == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas."
            exit 0
          fi
          git commit -m "test(visual): capturas de referencia generadas en la imagen de Playwright de CI"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
