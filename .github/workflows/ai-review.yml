# Revisión de código con IA basada en las specs del proyecto.
#
# No es un linter más: le entrega al agente las mismas reglas que usa el equipo
# (constitución, arquitectura, specs de features y de capas) y le pide revisar el
# diff contra ellas. Complementa a Semgrep (reglas fijas) con criterio:
# tests huérfanos, mocks injustificados, tests duplicados entre capas, lógica en la
# capa equivocada o riesgos de seguridad que no calzan con un patrón.
#
# Usa Gemini CLI con la acción oficial google-github-actions/run-gemini-cli.
# Gemini lee GEMINI.md, AGENTS.md y CLAUDE.md (context.fileName en settings), escribe la
# revisión en un archivo y un paso de github-script la publica como UN comentario en el PR
# (lo crea o lo actualiza usando el marcador <!-- gemini-review -->).
#
# Activación: crea GEMINI_API_KEY en Settings, Secrets and variables, Actions. Puede ser un
# secreto o una variable del repositorio: este ejemplo acepta las dos para que funcione en
# clase. Ojo: una variable no se enmascara en los logs y la ve cualquiera con acceso al repo.
# En un proyecto real usa un secreto. Sin la clave el job termina en verde con un aviso.
# El modelo se cambia con la variable GEMINI_MODEL (por defecto el alias flash).
name: Revisión con IA

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    name: Revisión de código contra las specs (Gemini)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # comentario de resumen en el PR
    env:
      # Los secretos no se pueden usar en un if: se traduce a una variable del job
      HAS_GEMINI_KEY: ${{ (secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY) != '' }}
    steps:
      - name: Aviso si no hay API key
        if: env.HAS_GEMINI_KEY != 'true'
        run: |
          {
            echo "### Revisión con IA omitida"
            echo ""
            echo "No existe GEMINI_API_KEY como secreto ni como variable (o el PR viene de un fork)."
            echo "Para activarla, créala en Settings, Secrets and variables, Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Revisión con IA omitida: falta GEMINI_API_KEY."

      - name: Ocultar la clave en los logs
        if: env.HAS_GEMINI_KEY == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: echo "::add-mask::$GEMINI_KEY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_GEMINI_KEY == 'true'
        with:
          # El merge commit del PR y su primer padre (la punta de la rama base) bastan para el diff
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar el diff del PR
        if: env.HAS_GEMINI_KEY == 'true'
        run: |
          mkdir -p .gemini-review
          git diff HEAD^1 HEAD -- . ':(exclude)package-lock.json' ':(exclude)**/package-lock.json' \
            > .gemini-review/pr.diff
          git diff --name-only HEAD^1 HEAD > .gemini-review/archivos.txt
          echo "Archivos cambiados: $(wc -l < .gemini-review/archivos.txt)"

      - name: Revisar el PR con Gemini
        id: gemini
        if: env.HAS_GEMINI_KEY == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # Sin esto Gemini CLI puede ignorar .gemini/settings.json por la confianza de carpetas
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          settings: |-
            {
              "model": {
                "name": "${{ vars.GEMINI_MODEL || 'flash' }}",
                "maxSessionTurns": 30
              },
              "context": {
                "fileName": ["GEMINI.md", "AGENTS.md", "CLAUDE.md"]
              },
              "tools": {
                "exclude": ["run_shell_command", "web_fetch", "google_web_search"]
              }
            }
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres revisor de código del proyecto Biblioteca UC. El proyecto usa Spec Driven
            Development: las specs son la fuente de verdad. Sigue las instrucciones de AGENTS.md
            y CLAUDE.md. Responde en español de Chile, con tuteo, sin guiones largos ni punto y coma.

            El diff del PR está en .gemini-review/pr.diff y la lista de archivos cambiados en
            .gemini-review/archivos.txt. Revisa SOLO lo que cambió.

            1. Lee primero, en este orden:
               - specs/constitution.md (principios, en especial P4 política de tests y P5
                 seguridad). Calidad antes que cantidad: importa que cada test cubra un flujo
                 real o una regla de la spec, no el número de tests.
               - specs/architecture.md (capas y reglas ARCH-R1 a ARCH-R8)
               - las specs de features en specs/features/ relacionadas con los archivos del diff
               - el SPEC.md de cada carpeta de capa tocada (por ejemplo backend/src/loans/domain/SPEC.md)
            2. Revisa el diff contra las specs:
               - Reglas de negocio: el código implementa la regla con ID tal como dice la spec.
                 Si el PR agrega comportamiento que no está en ninguna spec, pídelo (P1).
               - Arquitectura: imports que cruzan capas (domain que importa NestJS o TypeORM,
                 presentation que usa repositorios, componentes que llaman fetch directo).
               - Política de tests (P4): tests sin ID de regla en el título (huérfanos), más de
                 6 tests por regla y capa, variantes del mismo caso en vez de particiones,
                 mocks con jest.fn o vi.fn sin justificación, aserciones débiles (toBeDefined,
                 toBeTruthy), esperas fijas (waitForTimeout), tests duplicados entre capas y
                 oráculos que recalculan la lógica de producción.
               - Contrato: cambios de API que no partieron por specs/api/openapi.yaml.
               - Seguridad (OWASP Top 10): inyección, validación de entrada, secretos, datos
                 sensibles en logs, dependencias nuevas innecesarias.
            3. Escribe la revisión completa en Markdown en el archivo .gemini-review/revision.md
               con estas secciones:
               - Veredicto: aprobar, aprobar con cambios menores o pedir cambios.
               - Reglas de spec afectadas.
               - Hallazgos por categoría. Cada hallazgo indica archivo y línea, cita el ID de
                 la regla o el principio (por ejemplo "P4.3" o "ARCH-R3") y propone el cambio.
               - Tests que faltan o sobran.
            No repitas lo que ya revisan las herramientas automáticas (formato, lint, tipos).
            Si no encuentras problemas, dilo en dos líneas. No modifiques ningún otro archivo.

      - name: Publicar la revisión en el PR
        if: env.HAS_GEMINI_KEY == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- gemini-review -->'
            const file = '.gemini-review/revision.md'
            const review = fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : (process.env.GEMINI_SUMMARY ?? '')
            if (!review.trim()) {
              core.setFailed('Gemini no generó la revisión. Revisa el log del paso anterior.')
              return
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '## Revisión con IA (Gemini)',
              '',
              review.slice(0, 60000),
              '',
              `<sub>Generada por Gemini CLI en el [run ${context.runId}](${runUrl}). Una persona decide qué cambios aplicar.</sub>`,
            ].join('\n')
            await core.summary.addRaw(body).write()
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              })
              const previous = comments.find(
                (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
              )
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
                core.info(`Comentario actualizado: ${previous.html_url}`)
              } else {
                const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body })
                core.info(`Comentario creado: ${data.html_url}`)
              }
            } catch (error) {
              // Los PR desde forks reciben un token de solo lectura: la revisión queda en el resumen del run
              core.warning(`No se pudo comentar en el PR (${error.status ?? error.message}). La revisión quedó en el resumen del run.`)
            }
