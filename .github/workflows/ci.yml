# Pipeline de CI con DevSecOps (sin CD). Ver docs/pipeline.md para el detalle de cada etapa.
#
#                ┌─ 1 Secretos ─────────────────────────────────────────────┐
#                ├─ 2 Calidad y especificación (lint, tipos, arquitectura,  │
#                │    Spectral, oasdiff, spec-trace, actionlint, zizmor)    │
#   0 Cambios ───┼─ 3 SAST (Semgrep)                                        ├─► 10 Evidencia en el PR
#                ├─ 4 Dependencias y misconfig (Trivy fs)                   │   y Resultado
#                ├─ 5 Unitarios ──┬─► 5 SonarQube efímero (quality gate)    │
#                ├─ 6 Integración y contrato backend (Testcontainers)       │
#                ├─ 7 E2E frontend con mock server (MSW)                    │
#                └────────────────┴─► 8 Build e imágenes ─► 9 Sistema y DAST┘
#
# Primer ciclo de feedback (etapas 1 a 7): código estático y pruebas que no necesitan
# desplegar nada. Segundo ciclo (etapas 8 y 9): la aplicación construida y corriendo.
# La etapa 8 espera a la etapa 2 y a los unitarios de la etapa 5 en verde: el ciclo lento no
# parte si el rápido falla. SonarQube (también etapa 5) corre en paralelo y bloquea en Resultado.
name: CI

on:
  # PR hacia cualquier rama: también corre en PRs apilados (una rama de feature sobre otra)
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo lo que necesita (mínimo privilegio)
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  CLOCK_FIXED_NOW: '2026-03-02T12:00:00Z'
  BACKEND_IMAGE: biblioteca-backend:ci
  FRONTEND_IMAGE: biblioteca-frontend:ci

jobs:
  # ---------------------------------------------------------------------------
  # 0 · Qué cambió. En un monorepo no tiene sentido probar el backend si el PR
  # solo toca el frontend. En push a main y workflow_dispatch se corre todo.
  # ---------------------------------------------------------------------------
  cambios:
    name: 0 · Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lista los archivos del PR con la API
    outputs:
      backend: ${{ steps.decidir.outputs.backend }}
      frontend: ${{ steps.decidir.outputs.frontend }}
      stack: ${{ steps.decidir.outputs.stack }}
    steps:
      - name: Filtrar rutas del PR
        id: filtro
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            specs:
              - 'specs/**'
            infra:
              - '.github/**'
              - 'tools/**'
              - '.semgrep/**'
              - 'docker-compose.yml'
              - 'package.json'
              - 'package-lock.json'
              - '.spectral.yaml'
              - '.gitleaks.toml'
              - 'sonar-project.properties'
              - '.prettierrc.json'
              - '.editorconfig'

      - name: Decidir qué etapas corren
        id: decidir
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filtro.outputs.backend }}
          FRONTEND: ${{ steps.filtro.outputs.frontend }}
          SPECS: ${{ steps.filtro.outputs.specs }}
          INFRA: ${{ steps.filtro.outputs.infra }}
        run: |
          # Un cambio en specs/ o en el pipeline afecta a las dos apps
          shared=false
          if [ "$EVENT" != "pull_request" ] || [ "$SPECS" = "true" ] || [ "$INFRA" = "true" ]
          then
            shared=true
          fi
          backend=false
          if [ "$shared" = "true" ] || [ "$BACKEND" = "true" ]
          then
            backend=true
          fi
          frontend=false
          if [ "$shared" = "true" ] || [ "$FRONTEND" = "true" ]
          then
            frontend=true
          fi
          stack=false
          if [ "$backend" = "true" ] || [ "$frontend" = "true" ]
          then
            stack=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "stack=$stack"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Etapas por cambios"
            echo "| Área | Corre |"
            echo "| --- | --- |"
            echo "| backend | $backend |"
            echo "| frontend | $frontend |"
            echo "| stack completo (etapas 8 y 9) | $stack |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Etapa 1 · Pre-commit y secretos. Lo mismo que el hook .githooks/pre-commit,
  # pero obligatorio: el hook local se puede saltar, el pipeline no.
  # ---------------------------------------------------------------------------
  secretos:
    name: 1 · Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # CLI en contenedor. gitleaks-action exige licencia pagada en organizaciones.
      - name: Buscar secretos en todo el historial
        run: |
          mkdir -p reports/gitleaks
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --report-format json --report-path /repo/reports/gitleaks/gitleaks.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gitleaks
          path: reports/gitleaks
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 2 · Calidad y especificación
  # ---------------------------------------------------------------------------
  calidad-backend:
    name: 2 · Calidad backend (lint, formato, tipos, arquitectura)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        id: instalar
        run: npm ci
      - name: ESLint
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run lint
      - name: Prettier
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run format:check
      - name: TypeScript
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run typecheck
      - name: Reglas de arquitectura ARCH-R1 a ARCH-R5 (dependency-cruiser)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run test:arch

  calidad-frontend:
    name: 2 · Calidad frontend (lint, formato, tipos, arquitectura, tipos del contrato)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        id: instalar
        run: npm ci
      - name: ESLint
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run lint
      - name: Prettier
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run format:check
      - name: TypeScript
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run typecheck
      - name: Reglas de arquitectura ARCH-R6 a ARCH-R8 (dependency-cruiser)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run test:arch
      - name: Tipos generados al día con el OpenAPI (drift del contrato)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run api:check

  contrato-openapi:
    name: 2 · Contrato OpenAPI (Spectral y oasdiff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Estilo del contrato (Spectral con .spectral.yaml)
        run: npm run lint:openapi -- --format github-actions

      - name: Cambios que rompen compatibilidad (oasdiff contra la rama base)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p reports/oasdiff
          if ! git show "origin/${BASE_REF}:specs/api/openapi.yaml" > reports/oasdiff/base.yaml 2>/dev/null
          then
            echo "La rama base todavía no tiene specs/api/openapi.yaml: no hay contra qué comparar."
            exit 0
          fi
          docker run --rm -v "$PWD:/work" -w /work tufin/oasdiff:v1.34.1 \
            changelog reports/oasdiff/base.yaml specs/api/openapi.yaml --format markdown \
            > reports/oasdiff/changelog.md
          {
            echo "### Cambios en el contrato (oasdiff)"
            cat reports/oasdiff/changelog.md
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/work" -w /work tufin/oasdiff:v1.34.1 \
            breaking reports/oasdiff/base.yaml specs/api/openapi.yaml \
            --fail-on ERR --format githubactions

  trazabilidad:
    name: 2 · Trazabilidad spec a tests y herramientas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Formato de tools/ y configuración raíz
        run: npm run format:check
      - name: Tests de las herramientas de CI
        run: npm run test:tools
      - name: Cada regla con tests, sin huérfanos y dentro del presupuesto (P1 y P4)
        if: ${{ !cancelled() }}
        run: npm run spec:trace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: spec-trace
          path: reports/spec-trace.*
          if-no-files-found: ignore

  lint-infra:
    name: 2 · Lint del pipeline (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sintaxis y shell de los workflows (actionlint con shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Seguridad de los workflows (zizmor)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format github .github

  # ---------------------------------------------------------------------------
  # Etapa 3 · SAST: análisis estático de seguridad del código
  # ---------------------------------------------------------------------------
  semgrep:
    name: 3 · SAST con Semgrep (registro + reglas propias)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # subir SARIF a la pestaña Security (code scanning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests de las reglas propias (.semgrep)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/.semgrep:/rules" -w /rules \
            semgrep/semgrep:1.182.1 semgrep --test . --metrics=off
      - name: Escaneo
        run: |
          mkdir -p reports/semgrep
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.182.1 semgrep scan \
            --config p/default --config p/typescript --config p/nodejs --config p/owasp-top-ten \
            --config .semgrep/rules.yml \
            --exclude .semgrep --exclude tools/__fixtures__ \
            --metrics=off \
            --json-output=reports/semgrep/semgrep.json \
            --sarif-output=reports/semgrep/semgrep.sarif
      # upload-sarif solo sube el reporte a la pestaña Security. No corre el análisis de CodeQL.
      - name: Subir SARIF a code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/semgrep/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: semgrep
          path: reports/semgrep/semgrep.json
          if-no-files-found: ignore
      - name: Compuerta (falla con hallazgos de severidad ERROR)
        run: |
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR" or .extra.severity == "HIGH" or .extra.severity == "CRITICAL")] | length' reports/semgrep/semgrep.json)
          echo "Hallazgos ERROR: $errors"
          jq -r '.results[] | select(.extra.severity == "ERROR" or .extra.severity == "HIGH" or .extra.severity == "CRITICAL") | "::error file=\(.path),line=\(.start.line)::\(.check_id): \(.extra.message)"' reports/semgrep/semgrep.json
          test "$errors" -eq 0

  # ---------------------------------------------------------------------------
  # Etapa 4 · Dependencias (SCA) y misconfig con Trivy fs. Una herramienta por análisis:
  # vuln revisa las dependencias, misconfig los Dockerfiles y docker-compose.yml.
  # Los secretos los revisa gitleaks en la etapa 1.
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: 4 · Dependencias y misconfig (Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # subir SARIF a la pestaña Security (code scanning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fecha para la caché de la base de Trivy
        id: fecha
        run: echo "dia=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.fecha.outputs.dia }}
          restore-keys: trivy-db-
      - name: Escaneo del repositorio
        run: |
          mkdir -p reports/trivy "$HOME/.cache/trivy"
          docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.76.1 fs --scanners vuln,misconfig \
            --skip-dirs tools/__fixtures__ \
            --format json --output reports/trivy/trivy-fs.json .
          docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.76.1 convert --format sarif --output reports/trivy/trivy-fs.sarif \
            reports/trivy/trivy-fs.json
          docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.76.1 convert --format table reports/trivy/trivy-fs.json
      - name: Subir SARIF a code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy/trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: trivy-fs
          path: reports/trivy/trivy-fs.json
          if-no-files-found: ignore
      - name: Compuerta (vulnerabilidades CRITICAL con parche)
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' reports/trivy/trivy-fs.json)
          echo "CRITICAL con parche: $critical"
          test "$critical" -eq 0

  # ---------------------------------------------------------------------------
  # Etapa 5 · Tests unitarios (la base de la pirámide)
  # ---------------------------------------------------------------------------
  unit-backend:
    name: 5 · Unitarios backend (dominio y aplicación, sin mocks)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cobertura-backend
          path: |
            backend/reports
            backend/coverage
          if-no-files-found: ignore

  unit-frontend:
    name: 5 · Unitarios y contrato de mocks frontend (Vitest + MSW)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unitarios y componentes con cobertura
        run: npm run test:unit
      - name: Los handlers de MSW cumplen el OpenAPI
        if: ${{ !cancelled() }}
        run: npm run test:contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cobertura-frontend
          path: |
            frontend/reports
            frontend/coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 5 · SonarQube efímero: calidad de código, cobertura y quality gate.
  # SonarQube Community corre en un contenedor temporal de este mismo runner y desaparece
  # al terminar el job: no hay servidor que pagar ni que mantener. tools/sonarqube/run.mjs
  # lo levanta, cambia la contraseña de admin por una aleatoria, crea un token y la quality
  # gate (las condiciones mínimas de calidad), analiza con sonar-project.properties y exporta
  # el resumen. Es el mismo comando que corres en tu máquina.
  # En un PR mide el código nuevo: analiza la base y después el HEAD, aplica la quality gate
  # del código nuevo y un bot comenta el resultado en el PR (comentario <!-- sonarqube-pr -->).
  # ---------------------------------------------------------------------------
  sonarqube:
    name: 5 · SonarQube efímero (calidad, cobertura y quality gate)
    needs: [cambios, unit-backend, unit-frontend]
    # Corre si alguna app cambió y ningún unitario falló. Un unitario omitido (su app no
    # cambió) no deja lcov: este job lo genera en el paso "Generar la cobertura que falte"
    if: ${{ !cancelled() && needs.cambios.outputs.stack == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write # crear o actualizar el comentario del bot con el código nuevo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historia completa: run.mjs hace checkout de la base y git blame dice qué líneas
          # son nuevas. En un PR se analiza el HEAD de la rama (no el merge con main), así los
          # links del comentario apuntan a las mismas líneas que vio SonarQube
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Se reutiliza la cobertura de unit-backend y unit-frontend: no se corren dos veces.
      # Si la app no cambió en el PR, el artefacto no existe y el paso sigue sin error
      - name: Descargar la cobertura del backend (etapa 5)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-backend
          path: backend
      - name: Descargar la cobertura del frontend (etapa 5)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-frontend
          path: frontend
      # SonarQube usa los tipos de node_modules para entender el código TypeScript
      - name: Instalar las dependencias de las apps
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
      - name: Generar la cobertura que falte
        run: |
          for app in backend frontend
          do
            if [ ! -f "$app/reports/coverage/lcov.info" ]
            then
              echo "::group::npm run test:unit en $app (sin artefacto de cobertura)"
              (cd "$app" && npm run test:unit)
              echo "::endgroup::"
            fi
          done
      # Si la quality gate falla, este paso falla y el job queda en rojo. El comentario del PR
      # se publica igual en el paso siguiente (if: always())
      - name: SonarQube efímero (levantar, analizar, exportar y borrar)
        env:
          # Vacías en push a main: un solo análisis de todo el código con QUALITY_GATE.
          # En un PR: modo PR, dos análisis y la quality gate del código nuevo
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/sonarqube/run.mjs
      # Un PR desde un fork no recibe permiso de escritura: ahí no se comenta
      - name: Comentar el código nuevo en el PR (bot de SonarQube)
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const file = 'reports/sonarqube/pr.md'
            if (!fs.existsSync(file)) {
              core.warning('No hay reports/sonarqube/pr.md: el análisis no llegó a exportar el código nuevo.')
              return
            }
            const marker = '<!-- sonarqube-pr -->'
            const body = fs.readFileSync(file, 'utf8').slice(0, 65000)
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
              core.info(`Comentario actualizado: ${previous.html_url}`)
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body })
              core.info(`Comentario creado: ${data.html_url}`)
            }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sonarqube
          path: |
            reports/sonarqube/summary.json
            reports/sonarqube/summary.md
            reports/sonarqube/pr.json
            reports/sonarqube/pr.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 6 · Integración y contrato del backend con PostgreSQL real (Testcontainers)
  # ---------------------------------------------------------------------------
  integracion-backend:
    name: 6 · Integración y contrato backend (Testcontainers + supertest)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Repositorios contra PostgreSQL en contenedor
        run: npm run test:integration
      - name: HTTP real contra el OpenAPI (controller a base de datos)
        if: ${{ !cancelled() }}
        run: npm run test:contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: contrato-backend
          path: backend/reports/contract-coverage.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 7 · E2E del frontend contra el mock server (MSW): no necesita backend
  # ---------------------------------------------------------------------------
  e2e-frontend:
    name: 7 · E2E frontend con mock server (Playwright + MSW)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # La misma imagen con la que se generaron las capturas de referencia visuales.
    # Fijada por digest: el tag podría moverse, el digest no.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Flujos, visual, estilos, layout y accesibilidad
        run: npm run test:e2e
        env:
          CI: 'true'
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidencia-mock
          path: frontend/evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mock
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 8 · Build de imágenes, escaneo y SBOM. Construye una vez y prueba ese
  # mismo artefacto en la etapa 9 (no se reconstruye).
  # ---------------------------------------------------------------------------
  imagenes:
    name: 8 · Build de imágenes, Trivy image y SBOM
    # El ciclo lento espera al rápido: la calidad de cada app, el contrato, la trazabilidad,
    # el lint del pipeline y los unitarios (etapas 2 y 5) tienen que estar en verde.
    needs:
      - cambios
      - calidad-backend
      - calidad-frontend
      - contrato-openapi
      - trazabilidad
      - lint-infra
      - unit-backend
      - unit-frontend
    if: ${{ !cancelled() && needs.cambios.outputs.stack == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # subir SARIF a la pestaña Security (code scanning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker compose build (contexto raíz, mismos build args que el stack)
        run: docker compose build
      - name: Fecha para la caché de la base de Trivy
        id: fecha
        run: echo "dia=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.fecha.outputs.dia }}
          restore-keys: trivy-db-
      - name: Trivy image y SBOM CycloneDX
        run: |
          mkdir -p reports/trivy "$HOME/.cache/trivy"
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/reports/trivy:/out" \
              aquasec/trivy:0.76.1 "$@"
          }
          for app in backend frontend
          do
            image="biblioteca-${app}:ci"
            trivy image --scanners vuln --format json --output "/out/trivy-image-${app}.json" "$image"
            trivy convert --format sarif --output "/out/trivy-image-${app}.sarif" "/out/trivy-image-${app}.json"
            trivy convert --format table "/out/trivy-image-${app}.json"
            trivy image --format cyclonedx --output "/out/sbom-${app}.cdx.json" "$image"
          done
      - name: Subir SARIF del backend
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy/trivy-image-backend.sarif
          category: trivy-image-backend
      - name: Subir SARIF del frontend
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy/trivy-image-frontend.sarif
          category: trivy-image-frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: trivy-imagenes
          path: |
            reports/trivy/*.json
          if-no-files-found: ignore
      - name: Compuerta (vulnerabilidades CRITICAL con parche en las imágenes)
        run: |
          status=0
          for app in backend frontend
          do
            report="reports/trivy/trivy-image-${app}.json"
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' "$report")
            echo "$app: CRITICAL con parche: $critical"
            if [ "$critical" -ne 0 ]
            then
              status=1
            fi
          done
          exit "$status"
      - name: Guardar las imágenes para la etapa 9
        run: docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | gzip -1 > imagenes.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagenes-docker
          path: imagenes.tar.gz
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Etapa 9 · Sistema: el stack real (imágenes de la etapa 8 + PostgreSQL)
  # ---------------------------------------------------------------------------
  sistema:
    name: 9 · Sistema (smoke API, Schemathesis, Playwright @smoke, k6, Lighthouse)
    needs: [cambios, imagenes]
    if: ${{ !cancelled() && needs.imagenes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagenes-docker
      - name: Levantar el stack y esperar los healthchecks
        id: stack
        run: |
          gunzip -c imagenes.tar.gz | docker load
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost:3001/api/health
      - name: Sembrar los datos de prueba de specs/flows/README.md
        id: siembra
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tools/seed-stack.mjs
        env:
          BASE_URL: http://localhost:3001

      - name: Instalar el frontend y Chromium (Playwright y Lighthouse)
        id: frontend
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Los E2E van primero, con los datos recién sembrados
      - name: Playwright @smoke contra el stack real
        if: ${{ !cancelled() && steps.siembra.outcome == 'success' && steps.frontend.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:smoke
        env:
          CI: 'true'
          E2E_TARGET: fullstack
          E2E_BASE_URL: http://localhost:3000

      - name: Smoke de todos los endpoints del contrato
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tools/api-smoke.mjs --out evidence/api
        env:
          BASE_URL: http://localhost:3001
      - name: Smoke en el resumen del run
        if: ${{ !cancelled() && hashFiles('evidence/api/endpoints.md') != '' }}
        run: cat evidence/api/endpoints.md >> "$GITHUB_STEP_SUMMARY"

      - name: Schemathesis (property based testing desde el OpenAPI)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          mkdir -p reports/schemathesis
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -w /tmp \
            -v "$PWD/specs/api:/specs:ro" -v "$PWD/reports/schemathesis:/reports" \
            schemathesis/schemathesis:4.32.5 run /specs/openapi.yaml \
            --url http://localhost:3001 \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance,response_headers_conformance \
            --phases examples,coverage,fuzzing \
            --max-examples 50 \
            --generation-database none \
            --report junit --report-junit-path /reports/junit.xml \
            --no-color

      - name: k6 (rendimiento de humo, p95 menor a 500 ms)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          mkdir -p evidence/perf
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e BASE_URL=http://localhost:3001 -e K6_SUMMARY_PATH=evidence/perf/k6-summary.json \
            grafana/k6:2.3.0 run tools/perf/k6-smoke.js

      # @lhci/cli autorun con frontend/lighthouserc.json (umbrales definidos por el frontend)
      - name: Lighthouse CI (rendimiento, buenas prácticas, SEO)
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:lighthouse
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Logs del stack si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidencia-fullstack
          path: frontend/evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-fullstack
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: api-smoke
          path: evidence/api
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: schemathesis
          path: reports/schemathesis
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: k6
          path: evidence/perf
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: frontend/reports/lighthouse
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 9 · DAST: OWASP ZAP ataca la aplicación corriendo (caja negra)
  # Job aparte: el escaneo activo crea datos basura y no debe ensuciar los E2E.
  # ---------------------------------------------------------------------------
  dast:
    name: 9 · DAST con OWASP ZAP (baseline frontend y API scan backend)
    needs: [cambios, imagenes]
    if: ${{ !cancelled() && needs.imagenes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagenes-docker
      - name: Levantar el stack y sembrar datos
        id: stack
        run: |
          gunzip -c imagenes.tar.gz | docker load
          docker compose up -d --no-build --wait --wait-timeout 180
          BASE_URL=http://localhost:3001 node tools/seed-stack.mjs
      - name: Preparar carpeta de trabajo de ZAP
        run: |
          mkdir -p reports/zap
          cp tools/zap/rules.tsv specs/api/openapi.yaml reports/zap/
          # El contenedor de ZAP corre con el usuario zap (uid 1000) y escribe aquí
          chmod -R a+rwX reports/zap
      - name: ZAP baseline contra el frontend (pasivo)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-baseline.py \
            -t http://localhost:3000 -c rules.tsv \
            -J zap-frontend.json -r zap-frontend.html -I
      - name: ZAP API scan contra el backend con el OpenAPI (activo)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-api-scan.py \
            -t /zap/wrk/openapi.yaml -f openapi -c rules.tsv \
            -J zap-api.json -r zap-api.html -I
      - name: Compuerta (alertas High o reglas FAIL de tools/zap/rules.tsv)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tools/zap/check-alerts.mjs reports/zap/zap-frontend.json reports/zap/zap-api.json
      - name: Logs del stack si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zap
          path: |
            reports/zap/*.json
            reports/zap/*.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Etapa 10 · Evidencia en el PR: capturas, GIF de los flujos y endpoints
  # ---------------------------------------------------------------------------
  evidencia:
    name: 10 · Evidencia en el PR
    needs:
      - cambios
      - secretos
      - calidad-backend
      - calidad-frontend
      - contrato-openapi
      - trazabilidad
      - lint-infra
      - semgrep
      - trivy-fs
      - unit-backend
      - unit-frontend
      - sonarqube
      - integracion-backend
      - e2e-frontend
      - imagenes
      - sistema
      - dast
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # publicar imágenes en la rama huérfana evidence
      pull-requests: write # crear o actualizar el comentario del PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Descargar la evidencia de todas las etapas
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: '{evidencia-*,contrato-backend,api-smoke,schemathesis,semgrep,trivy-*,zap,gitleaks,lighthouse,k6,spec-trace,sonarqube}'
      # La evidencia es opcional: si falla el GIF o la publicación, el comentario sale igual
      # (sin imágenes) con los endpoints y la seguridad
      - name: Convertir los videos de Playwright a GIF
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          node tools/evidence/videos-to-gif.mjs artifacts
      - name: Publicar imágenes en la rama evidence
        id: publicar
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: tools/evidence/publish-branch.sh artifacts "pr-${PR_NUMBER}/${RUN_ID}"
      - name: Armar el comentario
        if: ${{ !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Vacío si la publicación falló o no corrió: el comentario sale sin imágenes
          EVIDENCE_BASE_URL: ${{ steps.publicar.outcome == 'success' && format('https://raw.githubusercontent.com/{0}/evidence/pr-{1}/{2}', github.repository, github.event.pull_request.number, github.run_id) || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/evidence/build-comment.mjs --artifacts artifacts --out comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Crear o actualizar el comentario del PR
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- ci-evidence -->'
            const body = fs.readFileSync('comment.md', 'utf8').slice(0, 65000)
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
              core.info(`Comentario actualizado: ${previous.html_url}`)
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body })
              core.info(`Comentario creado: ${data.html_url}`)
            }

  # Un solo check para la protección de rama: falla si alguna etapa falló.
  # Las etapas omitidas por no tener cambios cuentan como éxito.
  resultado:
    name: Resultado del pipeline
    # cambios va aquí: si la etapa 0 falla, el resto se salta y sin ella esto pasaría en verde
    needs:
      - cambios
      - secretos
      - calidad-backend
      - calidad-frontend
      - contrato-openapi
      - trazabilidad
      - lint-infra
      - semgrep
      - trivy-fs
      - unit-backend
      - unit-frontend
      - sonarqube
      - integracion-backend
      - e2e-frontend
      - imagenes
      - sistema
      - dast
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verificar el resultado de todas las etapas
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'
          then
            echo "::error::Hay etapas con fallas. Revisa el comentario de evidencia del PR."
            exit 1
          fi
